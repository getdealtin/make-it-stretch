name: Keep Supabase + Render awake

# Supabase free-tier projects pause after ~7 days with no API activity, and
# Render free services spin down when idle. A once-daily request to /api/stats
# reads the Supabase events view (resetting its inactivity timer) and wakes
# Render at the same time. No secrets required — /api/stats is a public,
# aggregate-only endpoint.

on:
  schedule:
    # 13:17 UTC daily (~8:17am US Central). Off-the-hour on purpose: GitHub's
    # scheduled runners are congested at :00 and delay those jobs.
    - cron: "17 13 * * *"
  workflow_dispatch: {}   # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/stats (reads Supabase, wakes Render)
        run: |
          curl -fsS --retry 5 --retry-delay 15 --retry-all-errors --max-time 90 \
            "https://make-it-stretch.onrender.com/api/stats" > /dev/null \
            && echo "Keep-alive ping succeeded" \
            || { echo "Keep-alive ping failed"; exit 1; }
